# Full stack CSC Dashboard v3.1 (security fix atas v3) — bisa jalan
# BERBARENGAN dengan v3 asli tanpa bentrok: nama container, port host,
# dan nama volume SEMUANYA sudah diubah biar unik dari v3 (lihat suffix
# "-v31" / "_v31" di bawah).
#
# v3.1: migrasi database dari MySQL -> PostgreSQL, dan phpMyAdmin
# dihapus (tidak ada GUI database bawaan lagi). Kalau perlu lihat isi
# database secara visual, pakai DBeaver / TablePlus / psql langsung, atau
# jalankan `docker exec -it csc-postgres-v31 psql -U $POSTGRES_USER -d $POSTGRES_DB`.
#
# SEBELUM JALANIN, WAJIB:
#   cp .env.example .env                       (isi semua password acak)
#   cp csc-backend/.env.example csc-backend/.env
#   cp csc-dashboard/.env.example csc-dashboard/.env
#   -> isi BACKEND_API_KEY (backend) & VITE_API_KEY (frontend) dengan
#      NILAI YANG SAMA PERSIS dengan BACKEND_API_KEY di .env root ini.
#
# Jalankan dari folder ini:
#   docker compose up -d --build
#
# Service yang dinyalakan (PORT BEDA DARI v3 asli, biar bisa jalan bareng):
#   postgres    -> database, port 5443 (localhost only, SELALU -- lihat catatan di bawah)
#   whatsapp    -> GOWA, http://localhost:3020 (localhost only -- scan QR di sini)
#   backend     -> Express API, port 3021
#   frontend    -> React/Vite dashboard, port 5193
#
# CATATAN (security fix, Juli 2026): SEMUA service default di-bind ke
# 127.0.0.1 SAJA -- tidak terbuka ke jaringan luar host ini. Kalau tim
# perlu akses dashboard dari mesin lain (bukan dari host Docker ini
# langsung), ada 2 mode:
#
#   MODE A -- SSH tunnel/VPN (paling aman, tidak buka port apa pun ke
#   jaringan): biarkan LAN_BIND_HOST di .env kosong/default, lalu:
#     ssh -L 5193:127.0.0.1:5193 -L 3021:127.0.0.1:3021 user@host-docker
#
#   MODE B -- diakses langsung lewat jaringan lokal kantor (LAN), TANPA
#   tunnel (dipakai kalau host ini sudah di jaringan internal terpercaya):
#   isi LAN_BIND_HOST di .env root dengan IP internal server ini (BUKAN
#   0.0.0.0, biar tidak ikut ke-expose kalau server ini kebetulan juga
#   punya NIC/IP publik), contoh:
#     LAN_BIND_HOST=10.20.30.40
#   Ini HANYA membuka port backend (3021) & frontend (5193) ke LAN --
#   postgres (5443) & whatsapp (3020) TETAP localhost-only selamanya
#   (cuma admin server ini yang boleh akses DB & QR WhatsApp langsung).
#   Di mode ini, proteksi utamanya jadi BACKEND_API_KEY/SYSTEM_API_KEY
#   (lihat csc-backend/src/middleware/apiKeyAuth.js) -- pastikan itu
#   sudah diisi string acak yang kuat, BUKAN nilai contoh/testing.

services:
  postgres:
    image: postgres:16-alpine
    container_name: csc-postgres-v31
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - csc_postgres_data_v31:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    container_name: csc-whatsapp-v31
    restart: unless-stopped
    command: rest
    environment:
      # v3.2: fitur Approve/Reject -- kirim webhook tiap ada pesan masuk
      # (termasuk balasan "Approve"/"Reject" dari user) ke backend.
      # "backend" di sini nama service Docker di bawah (bukan localhost),
      # port 3001 = port INTERNAL container backend (lihat service
      # "backend" -> ports: "3021:3001", 3001 di kiri titik dua itu port
      # dalam Docker network, 3021 cuma exposed ke host laptop kamu).
      WHATSAPP_WEBHOOK: http://backend:3001/api/webhooks/whatsapp
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      # Cukup dengar event pesan masuk -- tidak perlu event lain (typing,
      # read receipt, dll) untuk fitur Approve/Reject ini.
      WHATSAPP_WEBHOOK_EVENTS: message
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - csc_whatsapp_storage_v31:/app/storages

  backend:
    build: ./csc-backend
    container_name: csc-backend-v31
    restart: unless-stopped
    env_file:
      - ./csc-backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      GOWA_BASE_URL: http://whatsapp:3000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      SYSTEM_API_KEY: ${SYSTEM_API_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      # Selalu izinkan localhost DAN 127.0.0.1 buat port frontend (5193),
      # karena browser menganggap keduanya origin yang beda walau
      # sama-sama nunjuk ke mesin ini -- ini yang bikin error CORS kalau
      # cuma salah satu yang diizinkan. Baris ini SENGAJA menimpa nilai
      # CORS_ORIGIN di csc-backend/.env supaya dua origin ini pasti selalu
      # diizinkan.
      #
      # ${LAN_FRONTEND_ORIGIN:-} -- isi kalau dashboard diakses lewat IP
      # LAN (mode B di komentar atas file ini), contoh di .env root:
      #   LAN_FRONTEND_ORIGIN=http://10.20.30.40:5193
      # Kosongkan variable ini (biarkan tidak diisi di .env) kalau cuma
      # dipakai via SSH tunnel (mode A) -- localhost/127.0.0.1 di bawah
      # sudah cukup.
      CORS_ORIGIN: "http://localhost:5193,http://127.0.0.1:5193,${LAN_FRONTEND_ORIGIN:-}"
    volumes:
      - ./csc-backend:/app
      - /app/node_modules
    ports:
      - "${LAN_BIND_HOST:-127.0.0.1}:3021:3001"
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./csc-dashboard
    container_name: csc-frontend-v31
    restart: unless-stopped
    env_file:
      - ./csc-dashboard/.env
    volumes:
      - ./csc-dashboard:/app
      - /app/node_modules
    ports:
      - "${LAN_BIND_HOST:-127.0.0.1}:5193:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  csc_postgres_data_v31:
  csc_whatsapp_storage_v31:
