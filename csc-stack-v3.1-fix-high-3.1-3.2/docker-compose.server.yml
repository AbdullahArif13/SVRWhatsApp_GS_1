# docker-compose.server.yml -- KHUSUS buat skenario: kode di-clone di 1
# mesin (mis. "VM A"), tapi Docker daemon-nya jalan di mesin LAIN (mis.
# "VM B"), dikontrol dari VM A lewat Docker remote context (lihat
# instruksi lengkap di bawah).
#
# BEDA dari docker-compose.yml biasa:
#   - TIDAK pakai bind mount (`volumes: - ./csc-backend:/app` dst) --
#     bind mount menunjuk ke folder di mesin TEMPAT DOCKER DAEMON-NYA
#     JALAN (VM B), BUKAN di mesin tempat kamu ngetik command (VM A).
#     Kalau tetap dipakai, container bakal cari folder yang gak pernah
#     ada di VM B -> error / isi container jadi kosong.
#   - Kode di-COPY ke dalam image PAS BUILD (bukan di-mount saat run),
#     jadi image-nya "membawa" kodenya sendiri, gak bergantung folder di
#     luar container. Ini juga sekalian cara paling wajar buat deploy ke
#     server beneran (bukan laptop dev): commit kode -> build image baru
#     -> jalankan image baru. Update kode = rebuild, bukan live-edit.
#   - backend: jalan `node src/server.js` biasa (BUKAN `node --watch`,
#     karena --watch itu gunanya buat mantau perubahan file yang di-mount
#     dari host -- percuma kalau tidak ada bind mount).
#   - frontend: build production (`vite build`) lalu di-serve statis
#     lewat `vite preview` -- BUKAN dev server (`vite`/npm run dev).
#     Dev server itu didesain buat coding sehari-hari (HMR dll), bukan
#     buat dipakai banyak orang sekaligus; production build jauh lebih
#     ringan & cepat buat dipakai tim.
#
# CARA PAKAI (jalankan SEMUA command di bawah dari VM A, di folder hasil
# clone project ini):
#
#   1) Pastikan Docker CLI ke-install di VM A (cukup CLI-nya saja, TIDAK
#      perlu Docker Engine/daemon nyala di VM A -- kita cuma numpang
#      "remote control" ke daemon yang di VM B):
#        curl -fsSL https://get.docker.com | sh
#
#   2) Pastikan VM A bisa SSH ke VM B tanpa password (pakai SSH key),
#      dan user itu punya akses Docker di VM B (masuk grup "docker" atau
#      pakai sudo):
#        ssh-keygen -t ed25519          (kalau VM A belum punya key)
#        ssh-copy-id <user>@<IP-VM-B>
#        ssh <user>@<IP-VM-B> docker ps  (tes -- harus jalan tanpa error)
#
#   3) Buat & aktifkan Docker context yang nunjuk ke VM B:
#        docker context create vm-b --docker "host=ssh://<user>@<IP-VM-B>"
#        docker context use vm-b
#      (Setelah ini, SEMUA command `docker`/`docker compose` yang kamu
#      jalankan di VM A otomatis dieksekusi di VM B, sampai kamu ganti
#      context lagi dengan `docker context use default`.)
#
#   4) Baru jalankan compose file INI (bukan docker-compose.yml biasa):
#        docker compose -f docker-compose.server.yml up -d --build
#
#   5) Update kode ke depannya: edit di VM A -> commit -> lalu ulangi
#      command langkah 4 (`up -d --build`) -- ini otomatis build ulang
#      image dari kode terbaru & jalankan ulang container-nya di VM B.
#
# .env yang dipakai file ini SAMA PERSIS dengan docker-compose.yml biasa
# (.env root, csc-backend/.env, csc-dashboard/.env) -- termasuk
# LAN_BIND_HOST & LAN_FRONTEND_ORIGIN, isi dengan IP VM B (tempat
# container-nya BENERAN jalan & port-nya BENERAN ke-bind), BUKAN IP VM A.

services:
  postgres:
    image: postgres:16-alpine
    container_name: csc-postgres-v31
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - csc_postgres_data_v31:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    container_name: csc-whatsapp-v31
    restart: unless-stopped
    command: rest
    environment:
      WHATSAPP_WEBHOOK: http://backend:3001/api/webhooks/whatsapp
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      WHATSAPP_WEBHOOK_EVENTS: message
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - csc_whatsapp_storage_v31:/app/storages

  backend:
    build: ./csc-backend
    container_name: csc-backend-v31
    restart: unless-stopped
    # TIDAK ada `node --watch` di sini -- gak ada file host yang di-mount
    # buat dipantau. Update kode = rebuild image (lihat instruksi atas).
    command: ["node", "src/server.js"]
    env_file:
      - ./csc-backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      GOWA_BASE_URL: http://whatsapp:3000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      SYSTEM_API_KEY: ${SYSTEM_API_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      CORS_ORIGIN: "http://localhost:5193,http://127.0.0.1:5193,${LAN_FRONTEND_ORIGIN:-}"
    # SENGAJA TIDAK ADA `volumes:` bind mount -- kode sudah ikut ter-COPY
    # ke image lewat Dockerfile (COPY . .) pas build.
    ports:
      - "${LAN_BIND_HOST:-127.0.0.1}:3021:3001"
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./csc-dashboard
    container_name: csc-frontend-v31
    restart: unless-stopped
    # Build production (bukan dev server) lalu serve statis -- lebih
    # ringan & cepat buat dipakai banyak orang. `npm run build` di sini
    # akan pakai VITE_API_BASE_URL & VITE_API_KEY dari csc-dashboard/.env
    # (lewat env_file di bawah) -- nilai itu "dipanggang" ke hasil build,
    # jadi kalau .env berubah, WAJIB `up -d --build` ulang.
    command: ["sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]
    env_file:
      - ./csc-dashboard/.env
    # SENGAJA TIDAK ADA `volumes:` bind mount, sama alasannya kayak backend.
    ports:
      - "${LAN_BIND_HOST:-127.0.0.1}:5193:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  csc_postgres_data_v31:
  csc_whatsapp_storage_v31:
